<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Refuse les thèmes sombres forcés (Dark Reader, mode sombre auto de Chrome) : la page gère ses couleurs -->
<meta name="darkreader-lock">
<meta name="color-scheme" content="only light">
<title>Backrooms core — Portfolio version 3D</title>
<style>
  /* Police de tout le site : le fichier .otf doit accompagner index.html partout où il est publié */
  @font-face { font-family:'Belvina'; src:url('CSBelvina-Regular_demo-BF669f0fb63ba84.otf') format('opentype'); font-display:swap; }
  html, body { margin:0; height:100%; overflow:hidden; background:#191014; color:#fff;
               font-family:'Belvina', "Courier New", monospace;
               touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { display:block; }
  button { font:inherit; cursor:pointer; }

  /* ---------- Écran d'accueil ---------- */
  #intro { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center;
           justify-content:center; text-align:center; cursor:pointer; background:#000; }
  #intro h1 { font-size:clamp(30px,6.5vw,60px); font-weight:normal; letter-spacing:2px; line-height:1.15;
              margin:0 0 18px; max-width:16em; padding:0 20px; }
  #intro .enter { font-size:clamp(20px,3.7vw,30px); animation:pulse 1.6s infinite; }
  #intro .ctrl  { font-size:clamp(11px,2.2vw,15px); color:rgba(255,255,255,.7); margin-top:22px;
                  background:rgba(255,255,255,.07); padding:8px 16px; border-radius:8px; max-width:44em; }
  #intro .note  { color:#e05555; font-size:clamp(10px,1.8vw,13px); margin-top:16px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ---------- Viseur, invite « cliquez », bandeau d'état ---------- */
  #viseur { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
            background:rgba(255,255,255,.85); box-shadow:0 0 4px rgba(0,0,0,.6); z-index:10; display:none; pointer-events:none; }
  #invite { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:12; display:none;
            background:rgba(30,15,50,.65); padding:8px 18px; border-radius:8px; font-size:14px; pointer-events:none; }
  #etat { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); z-index:30; display:none;
          background:rgba(18,8,30,.85); color:#ffe9c9; border:2px solid #f5e9d0; border-radius:10px;
          padding:10px 16px; font-size:14px; text-align:center; letter-spacing:1px; max-width:80vw; }
  #etat button { margin-top:8px; background:#f5e9d0; color:#22182e; border:none; border-radius:6px; padding:6px 14px; font-weight:bold; }

  /* ---------- Barre de commandes (haut de l'écran) ---------- */
  #barre { position:fixed; top:14px; left:14px; right:112px; z-index:25; display:none; gap:6px; align-items:center; flex-wrap:wrap; }
  #barre button { font-size:12px; color:#e8ddcf; background:rgba(22,14,32,.75); border:1px solid #6c5a7a;
                  border-radius:6px; padding:6px 10px; touch-action:none; }
  #barre button:hover { background:rgba(72,50,95,.9); }
  #barre button.actif, #reglages button.on { background:#d8b8c8; color:#22182e; border-color:#f0d8e2; }
  #barre .sep { width:1px; height:20px; background:#6c5a7a; margin:0 4px; }
  @media (max-width:640px) { #barre button[data-touche] { display:none; } }  /* le joystick prend le relais */

  /* ---------- Écran de pause (Échap) ---------- */
  #pause { position:fixed; inset:0; z-index:45; display:none; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; cursor:pointer; background:rgba(18,8,30,.72); backdrop-filter:blur(3px); color:#f2e9dc; }
  #pause h2 { margin:0 0 12px; font-size:clamp(22px,5vw,40px); letter-spacing:6px; color:#ffe9c9; }
  #pause .aide { font-size:13px; color:#c9bcd4; margin-bottom:20px; line-height:1.8; }
  #pause button { font-size:15px; background:#f5e9d0; color:#22182e; border:none; border-radius:8px; padding:9px 22px; font-weight:bold; }

  /* ---------- Joystick mobile ---------- */
  #joystick { position:fixed; left:22px; bottom:22px; width:120px; height:120px; z-index:20; display:none; border-radius:50%;
              background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35); touch-action:none; }
  #stick { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
           background:rgba(255,255,255,.55); box-shadow:0 2px 6px rgba(0,0,0,.4); }

  /* ---------- Panneau de réglages (touche P) — n'existe qu'avec index.html?reglages ---------- */
  #reglages-ouvre { position:fixed; top:14px; right:14px; z-index:59; display:none; font-size:11px; color:#e8ddcf;
                    background:rgba(22,14,32,.75); border:1px solid #6c5a7a; border-radius:6px; padding:4px 9px; }
  #reglages { position:fixed; top:14px; right:14px; z-index:60; display:none; background:rgba(22,14,32,.92); color:#f2e9dc;
              border:2px solid #6c5a7a; border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.5; max-width:250px; }
  #reglages h3 { margin:0 0 8px; font-size:13px; letter-spacing:2px; color:#ffe9c9; }
  #reglages .lbl { display:block; color:#a99bb5; text-transform:uppercase; letter-spacing:1px; font-size:10px; margin:8px 0 3px; }
  #reglages button { font-size:11px; margin:0 3px 3px 0; background:#33234a; color:#e8ddcf; border:1px solid #6c5a7a; border-radius:5px; padding:3px 8px; }
  #reglages .aide { color:#8d81a0; font-size:10px; margin-top:8px; }
</style>
</head>
<body>

<div id="intro">
  <h1 id="intro-titre"></h1>
  <div class="enter" id="intro-enter"></div>
  <div class="ctrl"  id="intro-ctrl"></div>
  <div class="note">version mobile pas à jour pour le moment</div>
</div>
<div id="viseur"></div>
<div id="invite">Cliquez dans l'image pour regarder autour de vous</div>
<div id="etat"></div>
<div id="barre">
  <button data-touche="KeyW">&#8593; avancer</button>
  <button data-touche="KeyX">&#8595; reculer</button>
  <button data-touche="KeyA">&#8592; gauche</button>
  <button data-touche="KeyD">&#8594; droite</button>
  <button data-touche="Space">&#9650; sauter</button>
  <span class="sep"></span>
  <button id="b-pause">&#10073;&#10073; pause</button>

</div>
<div id="pause">
  <h2>PAUSE</h2>
  <div class="aide">Z avancer &middot; X reculer &middot; Q et D sur les c&ocirc;t&eacute;s<br>
    ou les fl&egrave;ches du clavier &middot; souris pour regarder &middot; Espace pour sauter</div>
  <button id="b-reprendre">Reprendre la visite</button>
</div>
<div id="joystick"><div id="stick"></div></div>
<button id="reglages-ouvre">réglages · P</button>
<div id="reglages">
  <h3>RÉGLAGES</h3>
  <span class="lbl">Résolution du rendu</span><span id="g-res"></span>
  <span class="lbl">Fumée</span><span id="g-fum"></span>
  <div class="aide">P ferme ce panneau · Échap met en pause</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
'use strict';
/* =====================================================================
   BACKROOMS CORE — visite 3D du portfolio (three.js r128)

   Le monde entier vient de Blender (monde.glb). Ce fichier ajoute le visiteur
   (déplacements, collisions), l'interface, la lumière, l'eau et la fumée.

   CONTRAT DE NOMMAGE avec le .blend — c'est TOUT ce que le code attend :
     spawn (Empty)            point de départ. Absent → DEPART_GLB ci-dessous
     plafond…  (objets)       plafonds : reçoivent LUMIERE_CIELS / LUMIERE_PLAFONDS
     eau… / water… (objet ou matériau)   traversable + teinte COULEUR_EAU
     ce qui est animé ou riggé (personnages, requin)   ne bloque pas le visiteur
     tout le reste            solide
   Le bilan du monde chargé s'affiche dans la console (F12) : __debug.bilan
   ===================================================================== */
if (typeof THREE === 'undefined' || !THREE.GLTFLoader || !THREE.DRACOLoader) {
  const e = document.getElementById('etat');
  e.style.display = 'block';
  e.textContent = 'Bibliothèque 3D indisponible : vérifiez la connexion, puis rechargez.';
  throw new Error('three.js absent');
}

/* =====================================================================
   RÉGLAGES — tout ce qui se règle sans toucher à Blender
   ===================================================================== */
const TITRE = "Backrooms core. Portfolio version 3D";
// « monde.glb » est TOUJOURS la version en service. Pour essayer un autre export
// sans rien toucher : index.html?glb=monde_20260915.glb
const FICHIER_GLB = new URLSearchParams(location.search).get('glb') || 'monde.glb';
const RESOLUTION = 0.8;          // résolution interne du rendu : 1 = net, 0.5 = gros pixels PS1
const CAPTURE_IMMEDIATE = true;  // la souris est prise dès le clic sur l'accueil (la barre se cache pendant la capture, Échap la rend)

// Point d'arrivée = caméra « Camera.002 » du .blend, en repère three :
// three.x = blender.x · three.y = blender.z (hauteur) · three.z = −blender.y.
// Le visiteur est posé SUR LE SOL sous ce point. Un Empty « spawn » dans le .blend prend le dessus.
const DEPART_GLB = { x: 48.2, y: -0.815, z: 14.643, yaw: -0.6805, pitch: -0.0908 };

// Brouillard : distance où il commence / où tout est noyé (m), et sa couleur (aussi le fond d'écran)
const BROUILLARD = { pres: 12, loin: 70, couleur: 0x191014 };

/* --- Lumière (essai à chaud dans la console : __debug.expo(v), __debug.ambiante(v), __debug.lampes(echelle, plafond)) --- */
let EXPO_LUMIERE = 0.10;       // exposition globale — plus bas = plus tamisé
let AMBIANTE = 0.03;           // lumière ambiante — plus bas = plus contrasté
const AMBIANTE_HAUT = 0xe8b8c0, AMBIANTE_BAS = 0x9a7280;  // teintes chaudes (BAS éclaire les plafonds)
let ECHELLE_LAMPES = 0.06;     // facteur sur la puissance des lampes Blender (1 = brut)
let PLAFOND_LAMPES = 1400;     // genou doux (candelas) : une lampe forte s'en approche sans jamais l'atteindre

/* --- Plafonds : ils s'éclairent eux-mêmes (__debug.plafonds(ciels, pleins)) ---
   Dans le .blend, leur couleur de base est NOIRE (tout est peint dans l'émission) et le
   glTF plafonne l'émission à 1 : sans ceci ils rendent noirs. 0 = export Blender brut.
   Luminance mesurée à l'écran (pièce 7, sur 255) : force 1 → 39 · 2 → 62 · 3 → 78 · 4 → 90 */
let LUMIERE_CIELS = 3.0;       // plafonds de CIEL
let LUMIERE_PLAFONDS = 1.0;    // plafonds PLEINS
const MOTS_CIEL = /ciel|nuage|sky|cloud/i;                     // un ciel se reconnaît au nom de l'objet ou du matériau…
const CIELS_EN_PLUS = ['plafondOpenSpace', 'plafond_bureaux'];  // …sauf ces matériaux de ciel au nom trompeur
const TEINTE_PLAFOND_NU = 0xbdb7ad;                             // plafond sans texture : plâtre neutre

/* --- Poolrooms : la salle se règle à part (__debug.poolrooms(lampes, emissif)) ---
   Emprise en repère three, reprise de la collection POOLROOMS du .blend. */
let LUMIERE_POOLROOMS = 0.3;   // × sur les lampes situées dans la zone
let EMISSIF_POOLROOMS = 2.0;   // × sur les matériaux qui ne servent QUE dans la zone
const ZONE_POOLROOMS = { x: [36, 103], y: [-12, 13.5], z: [-11.5, 24] };

/* --- Eau (__debug.eau('#2a8f8a', 0.45, 0.2) · __debug.eau(null) = matériau Blender d'origine) ---
   Le bleu vu dans Blender est un REFLET ; three.js n'a rien à refléter et l'eau
   sortait gris-noir. On la remplace par une teinte NON éclairée, et on la traverse. */
let COULEUR_EAU = 0x2a8f8a;    // null = matériau Blender d'origine
let OPACITE_EAU = 0.45;        // combien elle couvre le fond du bassin
let LUMINOSITE_EAU = 0.2;      // multiplicateur sur la teinte (au-delà de 1 : sature vers le blanc)

/* --- Animations du .blend (__debug.anims(v)) --- */
let VITESSE_ANIMATIONS = 1.0;  // 1 = vitesse du .blend · 0 = tout figé

/* --- Fumée PS1 : billboards immobiles qui font face à la caméra (__debug.fumeeVisible(false)) ---
   nb = nuages visés · taille = diamètre min/max (m) · opacite min/max · haut = hauteur au-dessus du sol (m) */
const FUMEE_ACTIVE = true;
const FUMEE_COULEUR = 0xdfe6ea;  // blanc laiteux, à peine froid : reste lisible sur le carrelage blanc
const FUMEE_MAX = 820;           // garde-fou global
const FUMEE_GRAINE = 20260905;   // même graine = même fumée à chaque visite
const FUMEE_ZONES = [
  { nom:'piscine',    x:[ 14, 29], z:[   5,  15], nb: 90, taille:[2.5, 5.5], opacite:[0.10,0.24], haut:[0.1, 2.8] },
  { nom:'tunnel_ss',  x:[-14, 39], z:[  -8,  -3], nb:120, taille:[2.0, 4.5], opacite:[0.10,0.26], haut:[0.1, 2.2] },
  { nom:'couloir_p4', x:[ -7, -3], z:[  15,  27], nb: 60, taille:[2.0, 4.0], opacite:[0.10,0.26], haut:[0.1, 2.4] },
  { nom:'backrooms',  x:[  9, 32], z:[  34, 118], nb:160, taille:[2.5, 5.5], opacite:[0.09,0.22], haut:[0.1, 2.6] },
  { nom:'poolrooms',  x:[ 36,103], z:[ -11,  24], nb:200, taille:[3.0, 6.5], opacite:[0.07,0.18], haut:[0.2, 3.6] },
  { nom:'bureaux',    x:[ -4, 39], z:[  15,  36], nb: 45, taille:[2.0, 4.0], opacite:[0.05,0.12], haut:[0.2, 2.3] },
  { nom:'openspace',  x:[-10, 13], z:[  28,  47], nb: 30, taille:[2.0, 4.0], opacite:[0.05,0.12], haut:[0.2, 2.3] },
  { nom:'entree',     x:[ -4, 10], z:[  -5,   5], nb: 22, taille:[1.8, 3.2], opacite:[0.05,0.11], haut:[0.2, 2.1] },
];

/* --- Visiteur --- */
const VITESSE = 3.4;           // marche (m/s)
const FORCE_SAUT = 7.0;        // impulsion du saut (≈ 1 m de haut) · 0 = pas de saut
const HAUTEUR_YEUX = 1.6, HAUTEUR_JOUEUR = 1.72, RAYON_JOUEUR = 0.32, GRAVITE = 24;

/* =====================================================================
   SCÈNE : caméra, rendu, tone mapping AgX, ambiance
   ===================================================================== */
const IS_MOBILE = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && matchMedia('(pointer: coarse)').matches;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BROUILLARD.couleur, BROUILLARD.pres, BROUILLARD.loin);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 600);
camera.rotation.order = 'YXZ';

/* Tone mapping AgX — celui du viewport de Blender. three.js r128 ne connaît qu'ACES
   (plus contrasté, plus saturé) : on greffe AgX dans le shader À LA PLACE de la fonction
   LinearToneMapping (après la déclaration de toneMappingExposure, sinon le shader ne
   compile pas), puis on demande le mode « Linear » au rendu. */
const AGX_GLSL = `
const mat3 AGX_REC2020_TO_SRGB = mat3(
  vec3( 1.6605, -0.1246, -0.0182 ), vec3( -0.5876, 1.1329, -0.1006 ), vec3( -0.0728, -0.0083, 1.1187 ) );
const mat3 AGX_SRGB_TO_REC2020 = mat3(
  vec3( 0.6274, 0.0691, 0.0164 ), vec3( 0.3293, 0.9195, 0.0880 ), vec3( 0.0433, 0.0113, 0.8956 ) );
const mat3 AGX_INSET = mat3(
  vec3( 0.856627153315983, 0.137318972929847, 0.11189821299995 ),
  vec3( 0.0951212405381588, 0.761241990602591, 0.0767994186031903 ),
  vec3( 0.0482516061458583, 0.101439036467562, 0.811302368396859 ) );
const mat3 AGX_OUTSET = mat3(
  vec3( 1.1271005818144368, -0.1413297634984383, -0.14132976349843826 ),
  vec3( -0.11060664309660323, 1.157823702216272, -0.11060664309660294 ),
  vec3( -0.016493938717834573, -0.016493938717834257, 1.2519364065950405 ) );
const float AGX_MIN_EV = -12.47393;
const float AGX_MAX_EV = 4.026069;
vec3 agxContrast( vec3 x ) {
  vec3 x2 = x * x; vec3 x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
vec3 AgXToneMapping( vec3 color ) {
  color *= toneMappingExposure;
  color = AGX_INSET * ( AGX_SRGB_TO_REC2020 * color );
  color = clamp( ( log2( max( color, vec3( 1e-10 ) ) ) - AGX_MIN_EV ) / ( AGX_MAX_EV - AGX_MIN_EV ), 0.0, 1.0 );
  color = AGX_OUTSET * agxContrast( color );
  color = AGX_REC2020_TO_SRGB * pow( max( vec3( 0.0 ), color ), vec3( 2.2 ) );
  return clamp( color, 0.0, 1.0 );
}
`;
const chunkTM = THREE.ShaderChunk.tonemapping_pars_fragment;
const chunkAgX = chunkTM.replace(/vec3 LinearToneMapping\( vec3 color \) \{[\s\S]*?\n\}/,
  AGX_GLSL + '\nvec3 LinearToneMapping( vec3 color ) { return AgXToneMapping( color ); }');
const agxOK = chunkAgX !== chunkTM;
if (agxOK) THREE.ShaderChunk.tonemapping_pars_fragment = chunkAgX;
else console.warn('AgX : greffe impossible, ACES conservé');

const renderer = new THREE.WebGLRenderer({ antialias: RESOLUTION >= 0.99 });  // lissage seulement en rendu net
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BROUILLARD.couleur);
renderer.outputEncoding = THREE.sRGBEncoding;                 // couleurs sRGB, comme Blender
renderer.toneMapping = agxOK ? THREE.LinearToneMapping : THREE.ACESFilmicToneMapping;
renderer.physicallyCorrectLights = true;                      // lampes en watts / candelas, comme Blender
const canvas = renderer.domElement;
document.body.appendChild(canvas);
// Mobile : l'écran est petit et dense, le rendu à 0.8 px CSS rendait les textes des murs illisibles.
// On rend donc à la vraie densité de pixels (plafonnée à 2) ; le desktop garde son gros pixel PS1.
const ANISO = IS_MOBILE ? renderer.capabilities.getMaxAnisotropy() : 1;   // textes nets vus de biais (mobile)
function reglerResolution(r) {   // rendu interne basse résolution, étiré à l'écran sans flou (gros pixels)
  renderer.setPixelRatio(IS_MOBILE ? Math.min(r * (devicePixelRatio || 1), 2) : r);
  canvas.style.imageRendering = r < 0.99 ? 'pixelated' : 'auto';
}
reglerResolution(RESOLUTION);

const ambiante = new THREE.HemisphereLight(AMBIANTE_HAUT, AMBIANTE_BAS, AMBIANTE);
scene.add(ambiante);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   INTERFACE : accueil, bandeau d'état, barre de commandes, pause, overlays
   ===================================================================== */
const el = (id) => document.getElementById(id);
const elIntro = el('intro'), elViseur = el('viseur'), elInvite = el('invite'), elEtat = el('etat'),
      elBarre = el('barre'), elPause = el('pause');
let demarre = false;     // le visiteur a cliqué sur l'accueil
let verrouille = false;  // la souris est capturée par le canvas
let enPause = false;
const touches = new Set();   // touches physiques enfoncées (clavier + boutons de la barre)

/* bandeau d'état : progression du chargement, puis message d'erreur avec « Réessayer » */
function majEtat(texte, echec) {
  elEtat.style.display = texte ? 'block' : 'none';
  elEtat.textContent = texte;
  if (echec) {
    const b = document.createElement('button');
    b.textContent = 'Réessayer';
    b.addEventListener('click', () => location.reload());
    elEtat.append(document.createElement('br'), b);
  }
}

/* viseur, invite et barre selon l'état. Sous capture, TOUS les clics vont au canvas :
   la barre serait incliquable, on la retire ; Échap rend la souris et la barre revient. */
function majOverlays() {
  elViseur.style.display = (!IS_MOBILE && demarre && verrouille) ? 'block' : 'none';
  elInvite.style.display = (!IS_MOBILE && demarre && !verrouille && !enPause) ? 'block' : 'none';
  if (demarre) elBarre.style.display = (IS_MOBILE || !verrouille) ? 'flex' : 'none';
}

function basculerPause(v) {
  enPause = v === undefined ? !enPause : !!v;
  elPause.style.display = enPause ? 'flex' : 'none';
  touches.clear();                                                   // aucune touche ne reste coincée
  if (enPause && document.pointerLockElement) document.exitPointerLock();
  majOverlays();
}

el('intro-titre').textContent = TITRE;
el('intro-enter').textContent = IS_MOBILE ? 'Touchez pour entrer' : 'Cliquez pour entrer';
el('intro-ctrl').textContent = IS_MOBILE
  ? 'Joystick pour marcher · glissez pour regarder · boutons en haut pour sauter'
  : 'Z avancer · X reculer · Q et D sur les côtés (ou les flèches) · souris pour regarder · Espace pour sauter · Échap pour mettre pause';
elIntro.addEventListener('click', () => {
  demarre = true;
  elIntro.style.display = 'none';
  // ce clic est le geste que le navigateur exige pour accorder la capture de la souris
  if (CAPTURE_IMMEDIATE && !IS_MOBILE) verrouillerPointeur();
  majOverlays();
});

// chaque bouton de la barre simule sa touche tant qu'on le maintient enfoncé
elBarre.querySelectorAll('button[data-touche]').forEach((b) => {
  const presse  = (e) => { e.preventDefault(); touches.add(b.dataset.touche); b.classList.add('actif'); };
  const relache = () => { touches.delete(b.dataset.touche); b.classList.remove('actif'); };
  b.addEventListener('pointerdown', presse);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, relache));
});
el('b-pause').addEventListener('click', () => basculerPause(true));
// « retour » : dans l'iframe du portfolio, on demande au site parent de refermer l'habillage ;
// en plein onglet, on revient simplement en arrière
el('b-retour').addEventListener('click', () => {
  if (window.parent !== window) window.parent.postMessage('fermer-3d', '*');
  else history.back();
});
elPause.addEventListener('click', () => basculerPause(false));  // le bouton « Reprendre » est dedans

/* =====================================================================
   CONTRÔLES — clavier + souris (capture du pointeur), puis tactile
   ===================================================================== */
addEventListener('keydown', (e) => {
  if (e.code === 'Escape') { if (!enPause) basculerPause(true); return; }
  if (e.code === 'Space') e.preventDefault();    // n'active pas un bouton qui aurait le focus
  touches.add(e.code);
});
addEventListener('keyup', (e) => touches.delete(e.code));
addEventListener('blur', () => touches.clear());

function verrouillerPointeur() { try { canvas.requestPointerLock(); } catch (e) { /* non supporté */ } }
document.addEventListener('pointerlockchange', () => {
  verrouille = document.pointerLockElement === canvas;
  // une capture accordée en retard, pendant la pause, rendrait l'écran de pause incliquable
  if (verrouille && enPause) { document.exitPointerLock(); return; }
  // Échap rend la souris au système : on en profite pour mettre la visite en pause
  if (!verrouille && demarre && !IS_MOBILE) basculerPause(true);
  majOverlays();
});
document.addEventListener('mousemove', (e) => {
  if (!verrouille) return;
  joueur.yaw -= e.movementX * 0.0022;
  joueur.pitch = Math.max(-1.35, Math.min(1.35, joueur.pitch - e.movementY * 0.0022));
});
canvas.addEventListener('mousedown', () => {   // un clic dans l'image reprend la souris (pas pendant la pause)
  if (!IS_MOBILE && demarre && !enPause && !verrouille) verrouillerPointeur();
});

// --- mobile : joystick à gauche, regard au doigt sur le reste de l'écran ---
let joyAvant = 0, joyCote = 0, joyDoigt = null;
const elJoy = el('joystick'), elStick = el('stick');
if (IS_MOBILE) elJoy.style.display = 'block';
elJoy.addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation();
  if (joyDoigt === null) joyDoigt = e.changedTouches[0].identifier;
}, { passive: false });
elJoy.addEventListener('touchmove', (e) => {
  e.preventDefault(); e.stopPropagation();
  for (const t of e.changedTouches) {
    if (t.identifier !== joyDoigt) continue;
    const r = elJoy.getBoundingClientRect(), max = 40;
    let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    elStick.style.transform = `translate(${dx}px,${dy}px)`;
    joyCote = dx / max; joyAvant = -dy / max;
  }
}, { passive: false });
const finJoy = (e) => {
  for (const t of e.changedTouches) if (t.identifier === joyDoigt) {
    joyDoigt = null; joyAvant = joyCote = 0; elStick.style.transform = '';
  }
};
elJoy.addEventListener('touchend', finJoy);
elJoy.addEventListener('touchcancel', finJoy);

const doigts = new Map();   // id du doigt → dernière position
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) doigts.set(t.identifier, { x: t.clientX, y: t.clientY });
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const d = doigts.get(t.identifier);
    if (!d) continue;
    joueur.yaw -= (t.clientX - d.x) * 0.005;
    joueur.pitch = Math.max(-1.35, Math.min(1.35, joueur.pitch - (t.clientY - d.y) * 0.005));
    d.x = t.clientX; d.y = t.clientY;
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => { for (const t of e.changedTouches) doigts.delete(t.identifier); });

/* =====================================================================
   PHYSIQUE : le monde Blender fournit sols, murs et plafonds par lancers de rayons
   ===================================================================== */
let mondeGLB = null;       // { racine, collision: [maillages solides] } une fois le .glb monté
let dernierSol = null;     // dernier sol foulé : on y revient après une chute dans le vide
const rayon = new THREE.Raycaster();
const _o = new THREE.Vector3(), _d = new THREE.Vector3();

/* impacts sur les solides depuis (x, y, z) dans la direction (dx, dy, dz), du plus proche au plus loin */
function lancer(x, y, z, dx, dy, dz, portee) {
  rayon.set(_o.set(x, y, z), _d.set(dx, dy, dz).normalize());
  rayon.far = portee;
  return rayon.intersectObjects(mondeGLB.collision, false);
}
/* hauteur du sol sous (x, z), cherchée vers le bas depuis depuisY ; null si rien */
function solGLB(x, z, depuisY) {
  const h = lancer(x, depuisY, z, 0, -1, 0, 60);
  return h.length ? h[0].point.y : null;
}
/* un mur bloque-t-il le visiteur dans la direction (dx, dz) à moins de portee ? rayons aux genoux et à la poitrine */
function murGLB(dx, dz, portee) {
  return lancer(joueur.x, joueur.y + 0.55, joueur.z, dx, 0, dz, portee).length > 0
      || lancer(joueur.x, joueur.y + 1.4,  joueur.z, dx, 0, dz, portee).length > 0;
}
/* volume habitable au-dessus de (x, z) : on descend un rayon depuis le ciel et on cherche
   le premier intervalle vide d'au moins `creux` mètres — une pièce, pas un toit.
   Renvoie { sol, plafond } (plafond null à ciel ouvert), ou null s'il n'y a rien. */
function espaceGLB(x, z, creux = 1.9) {
  const h = lancer(x, 60, z, 0, -1, 0, 130);
  if (!h.length) return null;
  for (let i = 0; i < h.length - 1; i++)
    if (h[i].point.y - h[i + 1].point.y >= creux) return { sol: h[i + 1].point.y, plafond: h[i].point.y };
  return { sol: h[h.length - 1].point.y, plafond: null };
}

/* =====================================================================
   VISITEUR
   ===================================================================== */
const joueur = { x: DEPART_GLB.x, y: 0, z: DEPART_GLB.z, vy: 0, auSol: false, yaw: DEPART_GLB.yaw, pitch: DEPART_GLB.pitch };
let camY = HAUTEUR_YEUX;   // hauteur des yeux lissée (adoucit les marches)

function majPhysique(dx, dz, dt) {
  const pas = Math.hypot(dx, dz);
  if (pas > 1e-6) {
    if (!murGLB(dx / pas, dz / pas, pas + RAYON_JOUEUR)) { joueur.x += dx; joueur.z += dz; }
    else {   // glisse le long du mur, axe par axe
      if (dx && !murGLB(Math.sign(dx), 0, Math.abs(dx) + RAYON_JOUEUR)) joueur.x += dx;
      if (dz && !murGLB(0, Math.sign(dz), Math.abs(dz) + RAYON_JOUEUR)) joueur.z += dz;
    }
  }
  // sol sous les pieds, cherché depuis la poitrine : marches et pentes jusqu'à ~1,2 m se montent seules.
  // En montée (saut) on ignore le sol, sinon l'impulsion serait annulée à l'image suivante.
  const s = solGLB(joueur.x, joueur.z, joueur.y + 1.2);
  if (s !== null && s > joueur.y - 0.02 && joueur.vy <= 0) {
    joueur.y = s; joueur.vy = 0; joueur.auSol = true;
  } else {
    joueur.vy -= GRAVITE * dt;
    let ny = joueur.y + joueur.vy * dt;
    if (joueur.vy > 0) {
      // plafond infranchissable. Le rayon part des PIEDS, pas de la tête : debout sur un meuble,
      // la tête dépasse déjà le plafond et un rayon parti de là ne rencontrerait plus rien.
      const h = lancer(joueur.x, joueur.y + 0.05, joueur.z, 0, 1, 0, 40);
      if (h.length) {
        const yMax = h[0].point.y - HAUTEUR_JOUEUR - 0.02;   // hauteur max des pieds
        if (ny > yMax) { ny = Math.max(joueur.y, yMax); joueur.vy = 0; }
      }
    }
    if (s !== null && ny <= s) { ny = s; joueur.vy = 0; joueur.auSol = true; }
    else joueur.auSol = false;
    joueur.y = ny;
  }
  if (joueur.auSol) dernierSol = { x: joueur.x, y: joueur.y, z: joueur.z };
  if (joueur.y < -50) {   // tombé dans le vide : retour au dernier sol connu
    if (dernierSol) Object.assign(joueur, dernierSol, { vy: 0 });
    else placerAuDepart();
  }
}

function placerAuDepart() {
  const spawn = mondeGLB.racine.getObjectByName('spawn');
  const p = spawn ? spawn.getWorldPosition(new THREE.Vector3()) : DEPART_GLB;
  Object.assign(joueur, { x: p.x, z: p.z, vy: 0, yaw: DEPART_GLB.yaw, pitch: DEPART_GLB.pitch });
  // le sol JUSTE SOUS la hauteur visée. espaceGLB() part du ciel et s'arrêterait sur le
  // premier volume libre : aux poolrooms c'est un toit, 5 m trop haut. Repli si rien.
  let sol = solGLB(p.x, p.z, p.y + 0.4);
  if (sol === null) { const e = espaceGLB(p.x, p.z); sol = e ? e.sol : 2; }
  joueur.y = sol;
  camY = sol + HAUTEUR_YEUX;
}

function majJoueur(dt) {
  // clavier / barre et joystick s'additionnent. 'KeyW' 'KeyX' 'KeyA' 'KeyD' sont des
  // EMPLACEMENTS physiques de touches : Z, X, Q et D sur un clavier AZERTY.
  const t = (code) => (touches.has(code) ? 1 : 0);
  let avant = joyAvant + t('KeyW') + t('ArrowUp') - t('KeyX') - t('KeyS') - t('ArrowDown');
  let cote  = joyCote  + t('KeyD') + t('ArrowRight') - t('KeyA') - t('ArrowLeft');
  const n = Math.hypot(avant, cote);
  if (n > 1) { avant /= n; cote /= n; }
  const sy = Math.sin(joueur.yaw), cy = Math.cos(joueur.yaw);   // yaw 0 → regarde vers −z, droite = +x
  const dx = (-sy * avant + cy * cote) * VITESSE * dt;
  const dz = (-cy * avant - sy * cote) * VITESSE * dt;

  if (FORCE_SAUT > 0 && joueur.auSol && touches.has('Space')) { joueur.vy = FORCE_SAUT; joueur.auSol = false; }
  if (mondeGLB) majPhysique(dx, dz, dt);   // rien à faire tant que le monde n'est pas monté

  camY += (joueur.y + HAUTEUR_YEUX - camY) * Math.min(1, 14 * dt);
  camera.position.set(joueur.x, camY, joueur.z);
  camera.rotation.set(joueur.pitch, joueur.yaw, 0);
}

/* =====================================================================
   MONDE BLENDER : chargement du .glb, classement, lumière, eau, fumée, animations
   ===================================================================== */
const lampes = [], lampesPoolrooms = [], matsPoolrooms = [];
const matsCiels = [], matsPlafondsPleins = [];   // copies privées des matériaux de plafond
const eaux = [];                                 // { mesh, origine, teinte }
let mixer = null;                                // lecteur des animations
const bilan = {};                                // ce qui a été reconnu au chargement

const materiaux = (o) => (Array.isArray(o.material) ? o.material : [o.material]).filter(Boolean);
const dansPoolrooms = (p) => {
  const z = ZONE_POOLROOMS;
  return p.x >= z.x[0] && p.x <= z.x[1] && p.y >= z.y[0] && p.y <= z.y[1] && p.z >= z.z[0] && p.z <= z.z[1];
};
/* plafond : nom d'objet qui COMMENCE par « plafond » (pas « contient » : SM_ceiling_window est un
   meuble), sur l'objet ou un de ses parents — l'export glTF emboîte parfois le maillage sous un vide */
function estPlafond(o) {
  for (let n = o; n; n = n.parent) if (/^plafond/i.test(n.name)) return true;
  return false;
}
const estCiel = (o, m) => MOTS_CIEL.test(o.name) || MOTS_CIEL.test(m.name) || CIELS_EN_PLUS.includes(m.name);
const estEau  = (o, m) => /^(eau|water)/i.test(o.name) || /^(eau|water)/i.test(m.name);

function monterMonde(gltf) {
  const racine = gltf.scene;
  mondeGLB = { racine, collision: [] };

  // ce qu'un clip anime (le requin sur son trajet, par exemple) ne doit pas bloquer le visiteur
  const animes = new Set();
  gltf.animations.forEach((clip) => clip.tracks.forEach((t) => animes.add(THREE.PropertyBinding.parseTrackName(t.name).nodeName)));
  const estAnime = (o) => {
    for (let n = o; n; n = n.parent) if (n.isSkinnedMesh || animes.has(n.name)) return true;
    return false;
  };

  const squelettes = new Set();
  racine.traverse((o) => {
    if (o.isLight) { lampes.push(o); return; }
    if (!o.isMesh) return;
    if (o.isSkinnedMesh) {
      // three.js décide d'afficher un personnage d'après une sphère calculée sur la pose AU REPOS :
      // posé ou animé autrement, il disparaîtrait par morceaux selon l'angle de caméra
      o.frustumCulled = false;
      squelettes.add(o.skeleton.bones[0]);   // un squelette = un os racine (plusieurs maillages le partagent)
    }
    const plafond = estPlafond(o);
    // un plafond reçoit une COPIE de son matériau : sa lumière lui est propre, sans éclairer
    // un mur qui partagerait le même matériau
    if (plafond) o.material = Array.isArray(o.material) ? o.material.map((m) => m && m.clone()) : o.material && o.material.clone();
    const mats = materiaux(o);
    mats.forEach((m) => { m.side = THREE.DoubleSide; });   // murs en plans simples, visibles des deux côtés
    if (plafond) {
      mats.forEach((m) => { const liste = estCiel(o, m) ? matsCiels : matsPlafondsPleins; if (!liste.includes(m)) liste.push(m); });
    } else if (mats[0] && estEau(o, mats[0])) {
      // eau : matériau NON éclairé préparé ici, l'original gardé de côté (__debug.eau(null) le restitue)
      eaux.push({ mesh: o, origine: o.material, teinte: new THREE.MeshBasicMaterial({
        transparent: true, opacity: mats[0].opacity, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }) });
      return;   // et traversable : pas dans les solides
    }
    if (!estAnime(o)) mondeGLB.collision.push(o);
  });
  scene.add(racine);
  racine.updateMatrixWorld(true);

  // ce qui appartient à la salle des poolrooms. Un matériau aussi utilisé AILLEURS est exclu, sinon
  // éclairer la salle éclairerait ailleurs. Repère : centre de la sphère englobante, pas l'origine
  // de l'objet (beaucoup d'objets ont leur origine à 0, 0, 0).
  const usage = new Map(), p = new THREE.Vector3();
  racine.traverse((o) => {
    if (o.isLight) { if (dansPoolrooms(o.getWorldPosition(p))) lampesPoolrooms.push(o); return; }
    if (!o.isMesh || !o.geometry) return;
    if (ANISO > 1) materiaux(o).forEach((m) => { if (m.map && m.map.anisotropy !== ANISO) { m.map.anisotropy = ANISO; m.map.needsUpdate = true; } });
    if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
    const dedans = dansPoolrooms(p.copy(o.geometry.boundingSphere.center).applyMatrix4(o.matrixWorld));
    materiaux(o).forEach((m) => {
      const u = usage.get(m) || { dedans: false, dehors: false };
      u[dedans ? 'dedans' : 'dehors'] = true;
      usage.set(m, u);
    });
  });
  usage.forEach((u, m) => { if (u.dedans && !u.dehors) matsPoolrooms.push(m); });

  // animations : sans lecteur, les squelettes resteraient sur les transformations par défaut du glTF
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(racine);
    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
  }

  appliquerLumiere();
  placerAuDepart();
  if (FUMEE_ACTIVE) construireFumee();

  let maillages = 0;
  racine.traverse((o) => { if (o.isMesh) maillages++; });
  Object.assign(bilan, {
    fichier: FICHIER_GLB, maillages, solides: mondeGLB.collision.length, lampes: lampes.length,
    plafonds: { ciels: matsCiels.length, pleins: matsPlafondsPleins.length }, nappesEau: eaux.length,
    animations: gltf.animations.map((c) => c.name), squelettes: squelettes.size,
    poolrooms: { lampes: lampesPoolrooms.length, materiaux: matsPoolrooms.length },
    spawn: !!racine.getObjectByName('spawn'),
  });
  console.info('monde monté', bilan);
}

/* lampes, matériaux des poolrooms, plafonds, ambiance, exposition, eau — rejouable à chaud */
function appliquerLumiere() {
  lampes.forEach((l) => {
    if (l.userData.i0 === undefined) l.userData.i0 = l.intensity;   // puissance Blender, mémorisée une fois
    l.decay = 2; l.distance = 0;                                     // atténuation physique, portée illimitée
    // genou doux plutôt qu'une coupe nette : une lampe faible passe intacte, une forte
    // s'approche de PLAFOND_LAMPES sans l'atteindre — l'écart entre les lampes reste lisible
    const brut = l.userData.i0 * ECHELLE_LAMPES;
    l.intensity = PLAFOND_LAMPES * (1 - Math.exp(-brut / PLAFOND_LAMPES)) * (lampesPoolrooms.includes(l) ? LUMIERE_POOLROOMS : 1);
  });
  matsPoolrooms.forEach((m) => {
    if (m.emissiveIntensity === undefined) return;
    if (m.userData.e0 === undefined) m.userData.e0 = m.emissiveIntensity;
    m.emissiveIntensity = m.userData.e0 * EMISSIF_POOLROOMS;
  });
  // plafonds : l'émission est refaite à partir de la texture (ou d'une teinte neutre). 0 = export brut.
  [[matsCiels, LUMIERE_CIELS], [matsPlafondsPleins, LUMIERE_PLAFONDS]].forEach(([liste, force]) => liste.forEach((m) => {
    if (!m.emissive) return;
    if (!m.userData.p0) m.userData.p0 = { e: m.emissive.clone(), map: m.emissiveMap || null, i: m.emissiveIntensity };
    const d = m.userData.p0;
    if (!(force > 0)) { m.emissive.copy(d.e); m.emissiveMap = d.map; m.emissiveIntensity = d.i; }
    else {
      m.emissiveMap = d.map || m.map || null;
      if (m.emissiveMap) m.emissive.setRGB(force, force, force);
      else if (m.color.r + m.color.g + m.color.b < 0.02) m.emissive.set(TEINTE_PLAFOND_NU).multiplyScalar(force);  // base noire dans le .blend
      else m.emissive.copy(m.color).multiplyScalar(force);
      m.emissiveIntensity = 1;
    }
    m.needsUpdate = true;   // ajouter ou retirer une emissiveMap change le shader
  }));
  ambiante.intensity = AMBIANTE;
  renderer.toneMappingExposure = EXPO_LUMIERE;
  appliquerEau();
}

function appliquerEau() {
  eaux.forEach(({ mesh, origine, teinte }) => {
    if (COULEUR_EAU === null) { mesh.material = origine; return; }
    teinte.color.set(COULEUR_EAU).multiplyScalar(LUMINOSITE_EAU);
    teinte.opacity = OPACITE_EAU;
    mesh.material = teinte;
  });
}

/* --- fumée : billboards immobiles (THREE.Sprite fait toujours face à la caméra) --- */
const groupeFumee = new THREE.Group();
scene.add(groupeFumee);

function textureNuage() {   // 64 px, dégradé radial tramé : la fumée PS1 n'était jamais lisse
  const T = 64, cv = document.createElement('canvas');
  cv.width = cv.height = T;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(T / 2, T / 2, 0, T / 2, T / 2, T / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, T, T);
  const img = g.getImageData(0, 0, T, T), d = img.data;
  let s = 1337;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 3; i < d.length; i += 4) d[i] = Math.min(255, d[i] * (0.75 + 0.5 * rnd()));
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  return tex;
}

function construireFumee() {
  const tex = textureNuage();
  let s = FUMEE_GRAINE >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const entre = (a, b) => a + (b - a) * rnd();
  let poses = 0;
  for (const z of FUMEE_ZONES) {
    // beaucoup de tirages tombent hors des murs : on insiste jusqu'au compte
    for (let vises = z.nb, essais = 0; vises > 0 && essais < z.nb * 60 && poses < FUMEE_MAX; essais++) {
      const px = entre(z.x[0], z.x[1]), pz = entre(z.z[0], z.z[1]);
      const esp = espaceGLB(px, pz);   // il faut une PIÈCE, pas un toit
      if (!esp) continue;
      const hautMax = esp.plafond === null ? z.haut[1] : Math.min(z.haut[1], Math.max(0.2, esp.plafond - esp.sol - 0.35));
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tex, color: FUMEE_COULEUR, transparent: true, depthWrite: false, fog: true,
        opacity: entre(z.opacite[0], z.opacite[1]),
      }));
      const d = entre(z.taille[0], z.taille[1]);
      sp.scale.set(d, d * entre(0.55, 0.8), 1);   // nuages aplatis
      sp.position.set(px, esp.sol + entre(Math.min(z.haut[0], hautMax), hautMax), pz);
      sp.renderOrder = 2;
      groupeFumee.add(sp);
      vises--; poses++;
    }
  }
  return poses;
}

/* --- chargement --- */
const chargeur = new THREE.GLTFLoader();
const draco = new THREE.DRACOLoader();   // la géométrie du .glb est compressée en Draco (~10× plus léger)
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
chargeur.setDRACOLoader(draco);
majEtat('Chargement du monde…');
chargeur.load(FICHIER_GLB,
  (g) => {
    try { monterMonde(g); majEtat(''); }
    catch (e) { console.error(e); majEtat('Ce monde est illisible : ' + e.message, true); }
  },
  (evt) => { if (evt.total) majEtat('Chargement du monde… ' + Math.round(evt.loaded / evt.total * 100) + ' %'); },
  () => majEtat('Le monde n’a pas pu être chargé.', true));

/* =====================================================================
   DÉBOGAGE — depuis la console du navigateur (F12), sans effet en usage normal
   ===================================================================== */
window.__debug = {
  joueur, camera, scene, renderer, bilan,
  get mondeGLB() { return mondeGLB; },
  get mixer() { return mixer; },   // __debug.mixer.update(0.1) avance les animations à la main (onglet en arrière-plan)
  expo(v)     { EXPO_LUMIERE = v; appliquerLumiere(); return v; },
  ambiante(v) { AMBIANTE = v;     appliquerLumiere(); return v; },
  lampes(echelle, plafond) {
    if (echelle !== undefined) ECHELLE_LAMPES = echelle;
    if (plafond !== undefined) PLAFOND_LAMPES = plafond;
    appliquerLumiere(); return [ECHELLE_LAMPES, PLAFOND_LAMPES];
  },
  plafonds(ciels, pleins) {
    if (ciels  !== undefined) LUMIERE_CIELS = ciels;
    if (pleins !== undefined) LUMIERE_PLAFONDS = pleins;
    appliquerLumiere(); return { ciels: LUMIERE_CIELS, pleins: LUMIERE_PLAFONDS };
  },
  listePlafonds() {   // vérifie le classement ciel / plein après un nouvel export
    const r = { ciels: [], pleins: [] };
    if (mondeGLB) mondeGLB.racine.traverse((o) => {
      if (!o.isMesh || !estPlafond(o)) return;
      const mats = materiaux(o);
      r[mats[0] && estCiel(o, mats[0]) ? 'ciels' : 'pleins'].push(o.name + ' [' + mats.map((m) => m.name || '—').join(', ') + ']');
    });
    return r;
  },
  poolrooms(lampesX, emissif) {
    if (lampesX !== undefined) LUMIERE_POOLROOMS = lampesX;
    if (emissif !== undefined) EMISSIF_POOLROOMS = emissif;
    appliquerLumiere(); return { lampes: LUMIERE_POOLROOMS, emissif: EMISSIF_POOLROOMS };
  },
  eau(couleur, opacite, luminosite) {   // __debug.eau('#2f86c5', 0.55) · __debug.eau(null) = origine Blender
    if (couleur === null) COULEUR_EAU = null;
    else if (couleur !== undefined) COULEUR_EAU = new THREE.Color(couleur).getHex();
    if (opacite !== undefined) OPACITE_EAU = opacite;
    if (luminosite !== undefined) LUMINOSITE_EAU = luminosite;
    appliquerEau(); return { couleur: COULEUR_EAU, opacite: OPACITE_EAU, luminosite: LUMINOSITE_EAU, nappes: eaux.length };
  },
  anims(v) { if (v !== undefined) VITESSE_ANIMATIONS = v; return VITESSE_ANIMATIONS; },
  fumeeVisible(v) { groupeFumee.visible = !!v; return groupeFumee.visible; },
  brouillard(pres, loin, couleur) {   // __debug.brouillard(4, 25) · __debug.brouillard(12, 70, 0x191014)
    if (pres !== undefined) scene.fog.near = pres;
    if (loin !== undefined) scene.fog.far = loin;
    if (couleur !== undefined) { scene.fog.color.set(couleur); renderer.setClearColor(couleur); }
    return [scene.fog.near, scene.fog.far, '#' + scene.fog.color.getHexString()];
  },
  resolution: reglerResolution,
  pause(v) { basculerPause(v); return enPause; },
  teleporter(x, z, yaw) {   // pose le visiteur au sol de la pièce en (x, z)
    joueur.x = x; joueur.z = z;
    if (yaw !== undefined) joueur.yaw = yaw;
    const esp = mondeGLB ? espaceGLB(x, z) : null;
    if (esp) joueur.y = esp.sol;
    camY = joueur.y + HAUTEUR_YEUX;
    camera.position.set(joueur.x, camY, joueur.z);
    camera.rotation.set(joueur.pitch, joueur.yaw, 0);
    return [joueur.x, joueur.y, joueur.z];
  },
};

/* --- panneau de réglages (touche P) : réservé à l'autrice, n'existe qu'avec index.html?reglages --- */
(function panneau() {
  const pan = el('reglages'), ouvre = el('reglages-ouvre');
  if (IS_MOBILE || !new URLSearchParams(location.search).has('reglages')) { pan.remove(); ouvre.remove(); return; }
  ouvre.style.display = 'block';
  const etat = { res: RESOLUTION, fum: 1 };
  function densiteFumee(f) {   // 0,5 : un nuage sur deux · 2 : tous, deux fois plus opaques
    etat.fum = f;
    groupeFumee.visible = f > 0;
    groupeFumee.children.forEach((sp, i) => {
      if (sp.userData.o0 === undefined) sp.userData.o0 = sp.material.opacity;
      sp.visible = f >= 1 || i % 2 === 0;
      sp.material.opacity = Math.min(0.55, sp.userData.o0 * Math.max(1, f));
    });
  }
  function dessiner() {
    const groupe = (id, choix, actif, action) => {
      const g = el(id);
      g.innerHTML = '';
      choix.forEach(([texte, v]) => {
        const b = document.createElement('button');
        b.textContent = texte;
        if (actif(v)) b.className = 'on';
        b.addEventListener('click', (e) => { e.stopPropagation(); action(v); dessiner(); });
        g.appendChild(b);
      });
    };
    groupe('g-res', [['0.4', 0.4], ['0.6', 0.6], ['0.8', 0.8], ['net', 1]],
      (v) => Math.abs(etat.res - v) < 0.01, (v) => { etat.res = v; reglerResolution(v); });
    groupe('g-fum', [['aucune', 0], ['discrète', 0.5], ['normale', 1], ['épaisse', 2]],
      (v) => etat.fum === v, densiteFumee);
  }
  function basculer(v) {
    const ouvert = v === undefined ? pan.style.display !== 'block' : v;
    pan.style.display = ouvert ? 'block' : 'none';
    ouvre.style.display = ouvert ? 'none' : 'block';
    if (ouvert) { dessiner(); if (document.pointerLockElement) document.exitPointerLock(); }
  }
  ouvre.addEventListener('click', (e) => { e.stopPropagation(); basculer(true); });
  pan.addEventListener('click', (e) => e.stopPropagation());
  addEventListener('keydown', (e) => { if (e.code === 'KeyP') basculer(); });
})();

/* =====================================================================
   BOUCLE PRINCIPALE
   ===================================================================== */
const horloge = new THREE.Clock();
camera.position.set(joueur.x, camY, joueur.z);   // caméra posée avant le premier rendu
camera.rotation.set(joueur.pitch, joueur.yaw, 0);
(function boucle() {
  requestAnimationFrame(boucle);
  const dt = Math.min(0.05, horloge.getDelta());
  if (!enPause) {
    majJoueur(dt);
    if (mixer) mixer.update(dt * VITESSE_ANIMATIONS);
  }
  renderer.render(scene, camera);
})();
</script>
</body>
